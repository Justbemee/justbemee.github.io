<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Martin Hanispak</title>
    <link rel="icon" href="images/Memory.webp">
    <link rel="stylesheet" href="style.css">
    <style>
        .hero-carousel {
            position: relative;
            width: 100%;
            height: 620px;
            overflow: hidden;
            border-radius: 12px;
        }
        .carousel-track {
            display: flex;
            height: 100%;
            animation: carousel 35s linear infinite;
        }
        .carousel-track img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            flex-shrink: 0;
        }
        @keyframes carousel {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }
    </style>
</head>
<body>

<div style="background:#f8f8f8; color:#555; text-align:center; padding:16px 20px; font-size:1.05rem; border-bottom:1px solid #eee;">
    This website is still growing and evolving.<br>
    Feel free to explore the gallery or <a href="contact.html" style="color:#0066cc; text-decoration:underline;">get in touch</a> directly.
</div>

    <!-- Dark mode slider -->
    <div style="position:fixed; top:20px; right:40px; z-index:200; text-align:right;">
        <label class="switch">
            <input type="checkbox" id="dark-toggle">
            <span class="slider"></span>
        </label>
    </div>

    <h1 style="margin: 25px 40px 30px; font-size: 2.55rem; font-family: 'Playfair Display', serif; font-weight:400;">Martin Hanispak</h1>

    <div style="display:flex; max-width:1200px; margin:0 auto; padding:0 40px; gap:80px;">

        <!-- Left side: Thumbnails under the name -->
        <div style="flex:1; max-width:280px;">
            <a href="about.html" class="item" style="display:flex; align-items:center; gap:20px; margin-bottom:25px; text-decoration:none; color:inherit;">
                <img src="images/Memory.webp" alt="" style="width:80px; height:80px; object-fit:cover; border-radius:8px;">
                <span style="font-size:1.25rem;">About</span>
            </a>
            <a href="gallery.html" class="item" style="display:flex; align-items:center; gap:20px; margin-bottom:25px; text-decoration:none; color:inherit;">
                <img src="images/Lost Acrylic on Canvas.webp" alt="" style="width:80px; height:80px; object-fit:cover; border-radius:8px;">
                <span style="font-size:1.25rem;">Portfolio</span>
            </a>
            <a href="contact.html" class="item" style="display:flex; align-items:center; gap:20px; margin-bottom:25px; text-decoration:none; color:inherit;">
                <img src="images/Love.webp" alt="" style="width:80px; height:80px; object-fit:cover; border-radius:8px;">
                <span style="font-size:1.25rem;">Contact</span>
            </a>
            <a href="thoughts.html" class="item" style="display:flex; align-items:center; gap:20px; margin-bottom:25px; text-decoration:none; color:inherit;">
                <img src="images/The face of Flower.webp" alt="" style="width:80px; height:80px; object-fit:cover; border-radius:8px;">
                <span style="font-size:1.25rem;">Thoughts</span>
            </a>
            <a href="consulting.html" class="item" style="display:flex; align-items:center; gap:20px; margin-bottom:25px; text-decoration:none; color:inherit;">
                <img src="images/Acrylic on Canvas Reused.webp" alt="" style="width:80px; height:80px; object-fit:cover; border-radius:8px;">
                <span style="font-size:1.25rem;">Consulting</span>
            </a>
        </div>

        <!-- Thin black separator line -->
        <div style="width:1px; background:#333; margin:20px 0;"></div>

        <!-- Right side: Wide rotating belt-style slideshow -->
        <div style="flex:2; position:relative;">
            <div class="hero-carousel">
                <div class="carousel-track" id="carousel-track">
                    <!-- Images added by JS -->
                </div>
            </div>
        </div>
    </div>

    <script>
    // Dark mode
    const toggle = document.getElementById('dark-toggle');
    toggle.addEventListener('change', () => {
        document.body.classList.toggle('dark', toggle.checked);
        localStorage.setItem('darkMode', toggle.checked);
    });
    if (localStorage.getItem('darkMode') === 'true') {
        document.body.classList.add('dark');
        toggle.checked = true;
    }

    // Rotating belt slideshow
    const images = [
        "images/Memory.webp",
        "images/Lost Acrylic on Canvas.webp",
        "images/Love.webp",
        "images/The face of Flower.webp",
        "images/Acrylic on Canvas Reused.webp",
        "images/Heart.webp",
        "images/We suffer more in imagination than in reality.webp",
        "images/You are on the right track now, do not turn..webp",
        "images/Fireworks.webp",
        "images/Hierarchy Monster.webp"
    ];

    const track = document.getElementById('carousel-track');
    images.forEach(src => {
        const img = document.createElement('img');
        img.src = src;
        track.appendChild(img);
    });

    // Duplicate for seamless loop
    images.forEach(src => {
        const img = document.createElement('img');
        img.src = src;
        track.appendChild(img);
    });
    </script>
</body>
</html>
