<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Martin Hanispak</title>
    <link rel="icon" href="images/Memory.webp">
    <link rel="stylesheet" href="style.css">
    <style>
        .main-container {
            display: flex;
            max-width: 1280px;
            margin: 40px auto 0;
            padding: 0 40px;
            gap: 70px;
        }
        .left-column {
            flex: 1;
            max-width: 290px;
        }
        .name {
            font-family: 'Playfair Display', serif;
            font-size: 2.6rem;
            font-weight: 400;
            margin-bottom: 40px;
            line-height: 1.1;
        }
        .thumbnail {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 26px;
            text-decoration: none;
            color: inherit;
            transition: all 0.3s ease;
        }
        .thumbnail:hover {
            transform: translateX(6px);
        }
        .thumbnail img {
            width: 82px;
            height: 82px;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.08);
        }
        .thumbnail span {
            font-size: 1.27rem;
        }

        .separator {
            width: 1px;
            background: #222;
            margin-top: 90px;
            align-self: stretch;
        }

        .right-column {
            flex: 2;
            height: 640px;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 15px 50px rgba(0,0,0,0.1);
        }
        .slideshow {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
        }
        .slideshow img {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 2s ease-in-out;
        }
        .slideshow img.active {
            opacity: 1;
        }
    </style>
</head>
<body>

    <!-- Top banner -->
    <div style="background:#f8f8f8; color:#555; text-align:center; padding:14px 20px; font-size:1.05rem; border-bottom:1px solid #eee;">
        This website is still growing and evolving.<br>
        Feel free to explore the gallery or <a href="contact.html" style="color:#0066cc; text-decoration:underline;">get in touch</a> directly.
    </div>

    <!-- Dark mode toggle -->
    <div style="position:fixed; top:22px; right:42px; z-index:300;">
        <label class="switch">
            <input type="checkbox" id="dark-toggle">
            <span class="slider"></span>
        </label>
    </div>

    <div class="main-container">

        <!-- Left column -->
        <div class="left-column">
            <div class="name">Martin Hanispak</div>

            <a href="about.html" class="thumbnail">
                <img src="images/Memory.webp" alt="">
                <span>About</span>
            </a>
            <a href="gallery.html" class="thumbnail">
                <img src="images/Lost Acrylic on Canvas.webp" alt="">
                <span>Portfolio</span>
            </a>
            <a href="contact.html" class="thumbnail">
                <img src="images/Love.webp" alt="">
                <span>Contact</span>
            </a>
            <a href="thoughts.html" class="thumbnail">
                <img src="images/The face of Flower.webp" alt="">
                <span>Thoughts</span>
            </a>
            <a href="consulting.html" class="thumbnail">
                <img src="images/Acrylic on Canvas Reused.webp" alt="">
                <span>Consulting</span>
            </a>
        </div>

        <!-- Separator -->
        <div class="separator"></div>

        <!-- Right column - Gentle multi-image slideshow (at least 6 images) -->
        <div class="right-column">
            <div class="slideshow" id="slideshow"></div>
        </div>
    </div>

    <script>
    // Dark mode
    const toggle = document.getElementById('dark-toggle');
    toggle.addEventListener('change', () => {
        document.body.classList.toggle('dark', toggle.checked);
        localStorage.setItem('darkMode', toggle.checked);
    });
    if (localStorage.getItem('darkMode') === 'true') {
        document.body.classList.add('dark');
        toggle.checked = true;
    }

    // Gentle slideshow with many images (slow transitions)
    const images = [
        "images/Memory.webp",
        "images/Lost Acrylic on Canvas.webp",
        "images/Love.webp",
        "images/The face of Flower.webp",
        "images/Acrylic on Canvas Reused.webp",
        "images/Heart.webp",
        "images/We suffer more in imagination than in reality.webp",
        "images/You are on the right track now, do not turn..webp",
        "images/Fireworks.webp",
        "images/Hierarchy Monster.webp",
        "images/Principles .webp"
    ];

    const slideshow = document.getElementById('slideshow');
    let current = 0;

    // Add all images
    images.forEach((src, i) => {
        const img = document.createElement('img');
        img.src = src;
        if (i === 0) img.classList.add('active');
        slideshow.appendChild(img);
    });

    function nextSlide() {
        const slides = slideshow.querySelectorAll('img');
        slides[current].classList.remove('active');
        current = (current + 1) % images.length;
        slides[current].classList.add('active');
    }

    setInterval(nextSlide, 5200);   // Change every 5.2 seconds - calm pace
    </script>
</body>
</html>
