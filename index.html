<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Martin Hanispak</title>
    <link rel="icon" href="images/Memory.webp">
    <link rel="stylesheet" href="style.css">
    <style>
        .main-container {
            display: flex;
            max-width: 1280px;
            margin: 40px auto 0;
            padding: 0 40px;
            gap: 80px;
        }
        .left-column {
            flex: 0 0 290px;   /* fixed width - thumbnails stay original size */
            width: 290px;
        }
        .name {
            font-family: 'Playfair Display', serif;
            font-size: 2.45rem;
            font-weight: 400;
            margin-bottom: 42px;
        }
        .home-list {
            display: flex;
            flex-direction: column;
            gap: 26px;
        }
        .item {
            display: flex;
            align-items: center;
            gap: 22px;
            text-decoration: none;
            color: inherit;
            transition: transform 0.3s ease;
        }
        .item:hover {
            transform: translateX(8px);
        }
        .item img {
            width: 82px;   /* exact original size */
            height: 82px;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.1);
        }
        .item span {
            font-size: 1.28rem;
        }

        .right-column {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
            gap: 30px;
        }
        .right-column img {
            width: 100%;
            height: 320px;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
        }

        .quote-area {
            grid-column: 1 / -1;
            text-align: center;
            padding: 20px 0 40px;
        }
        .quote-text {
            font-style: italic;
            font-size: 1.25rem;
            line-height: 1.7;
            margin-bottom: 25px;
        }
        #quote-image {
            width: 420px;
            height: 420px;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <!-- Top banner -->
    <div style="background:#f8f8f8; color:#555; text-align:center; padding:14px 20px; font-size:1.05rem; border-bottom:1px solid #eee;">
        This website is still growing and evolving.<br>
        Feel free to explore the gallery or <a href="contact.html" style="color:#0066cc; text-decoration:underline;">get in touch</a> directly.
    </div>

    <!-- Dark mode toggle -->
    <div style="position:fixed; top:20px; right:40px; z-index:200; text-align:right;">
        <label class="switch">
            <input type="checkbox" id="dark-toggle">
            <span class="slider"></span>
        </label>
    </div>

    <div class="main-container">

        <!-- Left - Original thumbnails -->
        <div class="left-column">
            <h1 class="name">Martin Hanispak</h1>
            <div class="home-list">
                <a href="about.html" class="item">
                    <img src="images/Memory.webp" alt="">
                    <span>About</span>
                </a>
                <a href="gallery.html" class="item">
                    <img src="images/Lost Acrylic on Canvas.webp" alt="">
                    <span>Portfolio</span>
                </a>
                <a href="contact.html" class="item">
                    <img src="images/Love.webp" alt="">
                    <span>Contact</span>
                </a>
                <a href="thoughts.html" class="item">
                    <img src="images/The face of Flower.webp" alt="">
                    <span>Thoughts</span>
                </a>
                <a href="consulting.html" class="item">
                    <img src="images/Acrylic on Canvas Reused.webp" alt="">
                    <span>Consulting</span>
                </a>
            </div>
        </div>

        <!-- Right - 3 large static images + quote (no scrolling) -->
        <div class="right-column">
            <img src="images/Heart.webp" alt="">
            <img src="images/Lost Acrylic on Canvas.webp" alt="">
            <img src="images/The face of Flower.webp" alt="">

            <!-- Quote -->
            <div class="quote-area">
                <p class="quote-text" id="quote-text">"Stop thinking and start doing."</p>
                <img id="quote-image" src="images/Love.webp" alt="">
            </div>
        </div>
    </div>

    <script>
    // Dark mode
    const toggle = document.getElementById('dark-toggle');
    toggle.addEventListener('change', () => {
        document.body.classList.toggle('dark', toggle.checked);
        localStorage.setItem('darkMode', toggle.checked);
    });
    if (localStorage.getItem('darkMode') === 'true') {
        document.body.classList.add('dark');
        toggle.checked = true;
    }

    // Quote rotator (optional)
    const quotes = [
        "Stop thinking and start doing.",
        "You are not a drop in the ocean. You are the entire ocean in a drop.",
        "Nature loves courage."
    ];
    const quoteImgs = ["images/Love.webp", "images/Heart.webp", "images/The face of Flower.webp"];

    let i = 0;
    function rotateQuote() {
        i = (i + 1) % quotes.length;
        document.getElementById('quote-text').textContent = '"' + quotes[i] + '"';
        document.getElementById('quote-image').src = quoteImgs[i];
    }
    setInterval(rotateQuote, 8000);
    </script>
</body>
</html>
