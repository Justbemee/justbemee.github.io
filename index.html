<script>

/* =========================
   THEME SYSTEM (FIXED)
========================= */

const toggle = document.getElementById('dark-toggle');
const menu = document.getElementById('theme-menu');

function applyTheme(theme) {
    document.body.classList.remove('dark-very','dark-warm','dark-cool');
    document.body.classList.add('dark-' + theme);
}

/* load saved state */
const savedDark = localStorage.getItem('darkMode');
const savedTheme = localStorage.getItem('theme') || 'very';

if (savedDark === 'true') {
    toggle.checked = true;
    menu.style.display = 'block';
    applyTheme(savedTheme);
}

/* toggle on/off */
toggle.addEventListener('change', () => {
    const isDark = toggle.checked;

    if (isDark) {
        applyTheme(localStorage.getItem('theme') || 'very');
        menu.style.display = 'block';
    } else {
        document.body.classList.remove('dark-very','dark-warm','dark-cool');
        menu.style.display = 'none';
    }

    localStorage.setItem('darkMode', isDark);
});

/* set theme */
function setTheme(theme) {
    applyTheme(theme);
    localStorage.setItem('theme', theme);
    localStorage.setItem('darkMode', 'true');
    toggle.checked = true;
    menu.style.display = 'block';
}

/* =========================
   QUOTES
========================= */

const quotes = [

let current = 0;

function showQuote() {
    const q = quotes[current % quotes.length];
    const img = allImages[current % allImages.length];

    document.getElementById('quote-text').textContent = '"' + q.text + '"';
    document.getElementById('quote-image').src = img;

}

showQuote();
setInterval(showQuote, 8000);

</script>
