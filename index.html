<script>
const quotes = [
    { text: "Love is the greatest power", source: "Martin Hanispak" },
    { text: "Believing in myself like no one else, yet painting for everyone else", source: "Martin Hanispak" },
    { text: "The greatest high is an expanding mind", source: "Martin Hanispak" }
];
const allImages = [
    { src: "images/Dinosaurus.webp", title: "Dinosaurus" },
    { src: "images/Fear is limitation - Love is infinity.webp", title: "Fear / Love" },
    { src: "images/Hierarchy Monster.webp", title: "Hierarchy Monster" },
    { src: "images/It is good if you are confused. It means you are constantly stepping into new territory.webp", title: "New Territory", imageClass: "slideshow-align-top" },
    { src: "images/Human lives becomes beautiful not because we do the right thinks. Human lives becomes beautiful because we put our heart in to what we are doing..webp", title: "Heart on fire" },
    { src: "images/disguise.webp", title: "Disguise", imageClass: "slideshow-align-top" },

];

let current = 0;
const slideshowImages = [...document.querySelectorAll('.slideshow-layer')];
let visibleImageIndex = 0;

function showQuote() {
    const q = quotes[current % quotes.length];
    const img = allImages[current % allImages.length];
    document.getElementById('quote-text').textContent = '"' + q.text + '"';
    const nextImageIndex = 1 - visibleImageIndex;
    const outgoingImage = slideshowImages[visibleImageIndex];
    const incomingImage = slideshowImages[nextImageIndex];
    const showImage = () => {
        incomingImage.className = 'hero-image slideshow-layer ' + (img.imageClass || '');
        incomingImage.src = img.src;
        requestAnimationFrame(() => {
            incomingImage.classList.add('is-visible');
            outgoingImage.classList.remove('is-visible');
            visibleImageIndex = nextImageIndex;
        });
    };
    const preloadedImage = new Image();
    preloadedImage.onload = showImage;
    preloadedImage.onerror = showImage;
    preloadedImage.src = img.src;
    current++;
}

showQuote();
setInterval(showQuote, 3000);

const right = document.querySelector('.home-right');

function updateLeftScrolled() {
    const left = document.querySelector('.home-left');
    if (!left) return;
    const scrolled = window.scrollY > 120 || (right && right.scrollTop > 120);
    left.classList.toggle('scrolled', scrolled);
}

window.addEventListener('scroll', updateLeftScrolled);
if (right) right.addEventListener('scroll', updateLeftScrolled);

// run once on load
updateLeftScrolled();

</script>

<script src="theme.js"></script>
