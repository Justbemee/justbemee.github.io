<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Martin Hanispak's Page</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { font-family: Arial, sans-serif; display: flex; }
        .sidebar { width: 200px; position: sticky; top: 0; background: #f5f5f5; padding: 20px; }
        .content { flex: 1; padding: 20px; overflow-y: auto; min-height: 100vh; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .quote { margin-top: 20px; }
        .quote-slideshow { /* Define styles for your slideshow */ }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>Martin Hanispak</h2>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Portfolio</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </div>
    <div class="content">
        <div class="grid">
            <img src="image1.jpg" alt="Image 1">
            <img src="image2.jpg" alt="Image 2">
            <img src="image3.jpg" alt="Image 3">
            <img src="image4.jpg" alt="Image 4">
        </div>
        <div class="quote">
            <div class="quote-slideshow">
                <!-- Slideshow implementation here -->
                <p>Quote 1</p>
                <p>Quote 2</p>
                <p>Quote 3</p>
            </div>
        </div>
    </div>
</body>
</html>
