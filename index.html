<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Martin Hanispak</title>
    <link rel="icon" href="images/Memory.webp">
    <link rel="stylesheet" href="style.css">
    <style>
        .main-container {
            display: flex;
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 40px;
            gap: 80px;
        }
        .left-column {
            flex: 1;
            max-width: 290px;
        }
        .name {
            font-family: 'Playfair Display', serif;
            font-size: 2.55rem;
            font-weight: 400;
            margin-bottom: 35px;
        }
        .home-list {
            display: flex;
            flex-direction: column;
            gap: 28px;
        }
        .item {
            display: flex;
            align-items: center;
            gap: 22px;
            text-decoration: none;
            color: inherit;
            transition: transform 0.3s ease;
        }
        .item:hover {
            transform: translateX(8px);
        }
        .item img {
            width: 82px;
            height: 82px;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.1);
        }
        .item span {
            font-size: 1.28rem;
        }

        .right-column {
            flex: 2;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }
        .large-image {
            width: 100%;
            height: 420px;
            object-fit: cover;
            border-radius: 16px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.12);
        }
        .quote-section {
            background: #f9f9f9;
            padding: 35px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        }
        body.dark .quote-section {
            background: #1a1a1a;
        }
    </style>
</head>
<body>

<div style="background:#f8f8f8; color:#555; text-align:center; padding:16px 20px; font-size:1.05rem; border-bottom:1px solid #eee;">
    This website is still growing and evolving.<br>
    Feel free to explore the gallery or <a href="contact.html" style="color:#0066cc; text-decoration:underline;">get in touch</a> directly.
</div>

    <!-- Dark mode slider -->
    <div style="position:fixed; top:20px; right:40px; z-index:200; text-align:right;">
        <label class="switch">
            <input type="checkbox" id="dark-toggle">
            <span class="slider"></span>
        </label>
    </div>

    <div class="main-container">

        <!-- Left side - Thumbnails (original size) -->
        <div class="left-column">
            <h1 class="name">Martin Hanispak</h1>
            <div class="home-list">
                <a href="about.html" class="item">
                    <img src="images/Memory.webp" alt="">
                    <span>About</span>
                </a>
                <a href="gallery.html" class="item">
                    <img src="images/Lost Acrylic on Canvas.webp" alt="">
                    <span>Portfolio</span>
                </a>
                <a href="contact.html" class="item">
                    <img src="images/Love.webp" alt="">
                    <span>Contact</span>
                </a>
                <a href="thoughts.html" class="item">
                    <img src="images/The face of Flower.webp" alt="">
                    <span>Thoughts</span>
                </a>
                <a href="consulting.html" class="item">
                    <img src="images/Acrylic on Canvas Reused.webp" alt="">
                    <span>Consulting</span>
                </a>
            </div>
        </div>

        <!-- Right side - Large images + quote space (inspired by Colorlib) -->
        <div class="right-column">
            <!-- Large featured images (you can change srcs to any of your paintings) -->
            <img src="images/Heart.webp" class="large-image" alt="">
            <img src="images/Lost Acrylic on Canvas.webp" class="large-image" alt="">
            <img src="images/The face of Flower.webp" class="large-image" alt="">

            <!-- Quote area -->
            <div class="quote-section">
                <hr style="border:none; border-top:1px solid #ddd; width:80%; margin:0 auto 25px;">
                <p id="quote-text" style="font-style:italic; font-size:1.18rem; margin-bottom:20px; line-height:1.6;"></p>
                <img id="quote-image" src="" alt="" style="width:420px; height:420px; object-fit:cover; border-radius:12px; box-shadow:0 10px 30px rgba(0,0,0,0.1);">
            </div>
        </div>
    </div>

    <script>
    // Dark mode
    const toggle = document.getElementById('dark-toggle');
    toggle.addEventListener('change', () => {
        document.body.classList.toggle('dark', toggle.checked);
        localStorage.setItem('darkMode', toggle.checked);
    });
    if (localStorage.getItem('darkMode') === 'true') {
        document.body.classList.add('dark');
        toggle.checked = true;
    }

    // Quote + image rotator (kept from your current version)
    const quotes = [
        { text: "The artist must train not only his eye but also his soul.", source: "" },
        { text: "Nature loves courage.", source: "" },
        { text: "Stop thinking and start doing.", source: "" }
    ];

    const allImages = [
        "images/Memory.webp","images/Lost Acrylic on Canvas.webp","images/Love.webp","images/The face of Flower.webp",
        "images/Acrylic on Canvas Reused.webp","images/Heart.webp","images/We suffer more in imagination than in reality.webp",
        "images/You are on the right track now, do not turn..webp","images/Fireworks.webp"
    ];

    let current = 0;
    function showQuote() {
        const q = quotes[current % quotes.length];
        const imgSrc = allImages[current % allImages.length];
        document.getElementById('quote-text').textContent = '"' + q.text + '"';
        document.getElementById('quote-image').src = imgSrc;
        current++;
    }
    showQuote();
    setInterval(showQuote, 7000);   // change every 7 seconds
    </script>
</body>
</html>
