<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Martin Hanispak</title>
    <link rel="icon" href="images/Memory.webp">
    <link rel="stylesheet" href="style.css">
    <style>
        .main-container {
            display: flex;
            max-width: 100%;
            margin: 40px 40px 0;
            padding: 0;
            gap: 60px;
        }
        .left-column {
            flex: 1;
            max-width: 290px;
        }
        .name {
            font-family: 'Playfair Display', serif;
            font-size: 2.45rem;
            font-weight: 400;
            margin-bottom: 42px;
            line-height: 1.05;
        }
        .thumbnail {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 28px;
            text-decoration: none;
            color: inherit;
            transition: transform 0.35s ease;
        }
        .thumbnail:hover {
            transform: translateX(6px);
        }
        .thumbnail img {
            width: 82px;   /* exact original size */
            height: 82px;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.1);
        }
        .thumbnail span {
            font-size: 1.27rem;
        }

        .right-column {
            flex: 2.8;
            height: 720px;
            overflow: hidden;
            position: relative;
            border-radius: 16px;
        }
        .film-belt {
            position: absolute;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 18px;
            transform: rotate(-1.6deg);   /* overall film tilt */
        }
        .film-belt img {
            width: 100%;
            height: auto;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.15);
            transform: rotate(var(--lean));
        }
        .film-belt img:nth-child(odd)  { --lean: -2.8deg; }
        .film-belt img:nth-child(even) { --lean: 2.4deg; }
    </style>
</head>
<body>

    <!-- Top banner -->
    <div style="background:#f8f8f8; color:#555; text-align:center; padding:14px 20px; font-size:1.05rem; border-bottom:1px solid #eee;">
        This website is still growing and evolving.<br>
        Feel free to explore the gallery or <a href="contact.html" style="color:#0066cc; text-decoration:underline;">get in touch</a> directly.
    </div>

    <!-- Dark mode toggle -->
    <div style="position:fixed; top:22px; right:42px; z-index:300;">
        <label class="switch">
            <input type="checkbox" id="dark-toggle">
            <span class="slider"></span>
        </label>
    </div>

    <div class="main-container">

        <!-- Left column -->
        <div class="left-column">
            <div class="name">Martin Hanispak</div>

            <a href="about.html" class="thumbnail">
                <img src="images/Memory.webp" alt="">
                <span>About</span>
            </a>
            <a href="gallery.html" class="thumbnail">
                <img src="images/Lost Acrylic on Canvas.webp" alt="">
                <span>Portfolio</span>
            </a>
            <a href="contact.html" class="thumbnail">
                <img src="images/Love.webp" alt="">
                <span>Contact</span>
            </a>
            <a href="thoughts.html" class="thumbnail">
                <img src="images/The face of Flower.webp" alt="">
                <span>Thoughts</span>
            </a>
            <a href="consulting.html" class="thumbnail">
                <img src="images/Acrylic on Canvas Reused.webp" alt="">
                <span>Consulting</span>
            </a>
        </div>

        <!-- Right column - Smooth vertical upward film belt -->
        <div class="right-column">
            <div class="film-belt" id="film-belt"></div>
        </div>
    </div>

    <script>
    // Dark mode
    const toggle = document.getElementById('dark-toggle');
    toggle.addEventListener('change', () => {
        document.body.classList.toggle('dark', toggle.checked);
        localStorage.setItem('darkMode', toggle.checked);
    });
    if (localStorage.getItem('darkMode') === 'true') {
        document.body.classList.add('dark');
        toggle.checked = true;
    }

    // Smooth upward scrolling film belt (JS version)
    const images = [
        "images/Memory.webp", "images/Lost Acrylic on Canvas.webp", "images/Love.webp",
        "images/The face of Flower.webp", "images/Acrylic on Canvas Reused.webp", "images/Heart.webp",
        "images/We suffer more in imagination than in reality.webp", "images/You are on the right track now, do not turn..webp",
        "images/Fireworks.webp", "images/Hierarchy Monster.webp", "images/Principles .webp",
        "images/We must understand the importance of freedom while we have it..webp"
    ];

    const belt = document.getElementById('film-belt');

    // Duplicate for seamless loop
    const allImages = [...images, ...images];
    allImages.forEach(src => {
        const img = document.createElement('img');
        img.src = src;
        belt.appendChild(img);
    });

    // Smooth scroll with JS (better control)
    let scrollPos = 0;
    const speed = 0.35;   // pixels per frame - adjust if too fast/slow

    function animate() {
        scrollPos += speed;
        belt.style.transform = `translateY(-${scrollPos}px) rotate(-1.6deg)`;

        // Reset when half way (seamless)
        if (scrollPos > belt.scrollHeight / 2) {
            scrollPos = 0;
        }
        requestAnimationFrame(animate);
    }
    animate();
    </script>
</body>
</html>
