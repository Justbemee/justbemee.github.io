<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Martin Hanispak</title>

<link rel="icon" href="images/Memory.webp">
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="top-banner">
This website is still growing and evolving.<br>
Feel free to explore the gallery or
<a href="contact.html" class="banner-link">get in touch</a>
directly.
</div>

<div class="theme-toggle">
    <label class="switch">
        <input type="checkbox" id="dark-toggle">
        <span class="slider"></span>
    </label>

    <div id="theme-menu" class="theme-menu">
        <button class="theme-btn" onclick="setTheme('very')">Dark</button>
        <button class="theme-btn" onclick="setTheme('warm')">Warm</button>
        <button class="theme-btn" onclick="setTheme('cool')">Cool</button>
    </div>
</div>

<h1 class="home-title">Martin Hanispak</h1>

<div class="home-layout">

<div class="home-list">

<a href="about.html" class="item"><img src="images/Memory.webp"><span>About</span></a>
<a href="gallery.html" class="item"><img src="images/Lost Acrylic on Canvas.webp"><span>Portfolio</span></a>
<a href="contact.html" class="item"><img src="images/Love.webp"><span>Contact</span></a>
<a href="thoughts.html" class="item"><img src="images/The face of Flower.webp"><span>Thoughts</span></a>
<a href="consulting.html" class="item"><img src="images/Acrylic on Canvas Reused.webp"><span>Consulting</span></a>

</div>

<div class="quote-section">
<hr class="quote-divider">
<p class="quote-text" id="quote-text"></p>
<img id="quote-image" src="">
</div>

</div>

<script src="theme.js"></script>

<script>
const quotes=[
{text:"The artist must train not only his eye but also his soul."},
{text:"Nature loves courage."},
{text:"Stop thinking and start doing."},
{text:"The only way to make sense out of change is to plunge into it."},
{text:"You are not a drop in the ocean. You are the entire ocean in a drop."}
];

const allImages=[
"images/Memory.webp",
"images/Lost Acrylic on Canvas.webp",
"images/Love.webp",
"images/The face of Flower.webp",
"images/Acrylic on Canvas Reused.webp"
];

let i=0;

function showQuote(){
document.getElementById("quote-text").textContent='"'+quotes[i%quotes.length].text+'"';
document.getElementById("quote-image").src=allImages[i%allImages.length];
i++;
}

showQuote();
setInterval(showQuote,8000);
</script>
<script src="theme.js"></script>
</body>
</html>
