<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Martin Hanispak</title>
    <link rel="icon" href="images/Memory.webp">
    <link rel="stylesheet" href="style.css">
        <script>
        (function(){
            document.documentElement.classList.remove('theme-preload');
            document.documentElement.style.background = '';
        })();
        </script>
</head>

<body class="home-page">

<!-- Top banner -->
<div id="top-banner" class="theme-banner" style="
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-60%);
    max-width: 600px;
    color: var(--muted);
    padding: 12px 16px;
    font-size: 1rem;
    border-radius: 10px;
    z-index: 150;
    text-align: center;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 0.35s ease, visibility 0.35s ease;
">
    This website is still growing and evolving.<br>
    Feel free to explore the gallery or 
    <a href="contact.html" style="color:var(--text); text-decoration:underline;">get in touch</a>.
</div>

<!-- Dark mode slider -->
<div style="position:fixed; top:20px; right:40px; z-index:200; text-align:right;">
    <label class="switch">
        <input type="checkbox" id="dark-toggle">
        <span class="slider"></span>
    </label>

    <div id="theme-menu" style="display:none; margin-top:8px;">
        <button class="theme-option" onclick="setTheme('very')">🌙 Dark</button>
        <button class="theme-option" onclick="setTheme('warm')">☀️ Warm</button>
        <button class="theme-option" onclick="setTheme('cool')">❄️ Cool</button>
    </div>

    <div id="theme-message" style="display:none; margin-top:8px; font-size:0.85rem; color:#555;"></div>
    <div id="theme-timer" style="display:none; margin-top:4px; font-size:0.85rem; color:#555;"></div>
</div>

<div class="home-wrapper">
    <div class="home-layout">

<!-- LEFT -->

        <div class="home-left">

<h1 class="home-title">
Martin Hanispak
</h1>

<div>

<a href="about.html" class="item">
<img src="images/Memory.webp" alt="">
<span>About</span>
</a>

<a href="gallery.html" class="item">
<img src="images/Lost Acrylic on Canvas.webp" alt="">
<span>Portfolio</span>
</a>

<a href="contact.html" class="item">
<img src="images/Love.webp" alt="">
<span>Contact</span>
</a>

<a href="thoughts.html" class="item">
<img src="images/The face of Flower.webp" alt="">
<span>Thoughts</span>
</a>

<a href="consulting.html" class="item">
<img src="images/Acrylic on Canvas Reused.webp" alt="">
<span>Consulting</span>
</a>

</div>

</div>

<!-- RIGHT -->

        <div class="home-right">
            <div class="quote-section">

<div class="slide">

<hr class="quote-line">

<p
class="quote-text"
id="quote-text">
</p>

<img
id="quote-image"
src=""
alt=""
class="hero-image">

<hr class="quote-bottom">

</div>

<div class="next-preview">

<p class="next-quote">
"The next work awaits."
</p>

<img
src="images/Love.webp"
class="hero-image">

<hr class="quote-bottom">

            </div>
        </div>

    </div>
</div>

<script>
const quotes = [
    { text: "Love is the greatest power", source: "Martin Hanispak" },
    { text: "Believing in myself like no one else, yet painting for everyone else", source: "Martin Hanispak" },
    { text: "The greatest high is an expanding mind", source: "Martin Hanispak" }
];
const allImages = [
    { src: "images/Dinosaurus.webp", title: "Dinosaurus" },
    { src: "images/Factory work must be replaced by AGI.webp", title: "Factory Work" },
    { src: "images/Fear is limitation - Love is infinity.webp", title: "Fear / Love" },
    { src: "images/Fireworks.webp", title: "Fireworks" },
    { src: "images/Hierarchy Monster.webp", title: "Hierarchy Monster" },

];

let current = 0;
function showQuote() {
    const q = quotes[current % quotes.length];
    const img = allImages[current % allImages.length];
    document.getElementById('quote-text').textContent = '"' + q.text + '"';
    document.getElementById('quote-image').src = img.src;
    current++;
}

showQuote();
setInterval(showQuote, 4000);

const right = document.querySelector('.home-right');

function updateLeftScrolled() {
    const left = document.querySelector('.home-left');
    if (!left) return;
    const scrolled = window.scrollY > 120 || (right && right.scrollTop > 120);
    left.classList.toggle('scrolled', scrolled);
}

window.addEventListener('scroll', updateLeftScrolled);
if (right) right.addEventListener('scroll', updateLeftScrolled);

// run once on load
updateLeftScrolled();

</script>

<script src="theme.js"></script>

</body>
</html>
