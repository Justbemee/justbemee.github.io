<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Martin Hanispak</title>
    <link rel="icon" href="images/Memory.webp">
    <link rel="stylesheet" href="style.css">
    <style>
        .main-container {
            display: flex;
            max-width: 1280px;
            margin: 40px auto 0;
            padding: 0 40px;
            gap: 80px;
        }
        .left-column {
            flex: 1;
            max-width: 290px;
        }
        .name {
            font-family: 'Playfair Display', serif;
            font-size: 2.55rem;
            font-weight: 400;
            margin-bottom: 40px;
        }
        .home-list {
            display: flex;
            flex-direction: column;
            gap: 28px;
        }
        .item {
            display: flex;
            align-items: center;
            gap: 22px;
            text-decoration: none;
            color: inherit;
            transition: transform 0.3s ease;
        }
        .item:hover {
            transform: translateX(8px);
        }
        .item img {
            width: 82px;
            height: 82px;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.1);
        }
        .item span {
            font-size: 1.28rem;
        }

        .right-column {
            flex: 2;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
        }
        .right-column img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            transition: transform 0.4s ease;
        }
        .right-column img:hover {
            transform: scale(1.04);
        }

        .quote-box {
            grid-column: 1 / -1;   /* spans full width */
            background: #f9f9f9;
            padding: 40px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        }
        body.dark .quote-box {
            background: #1a1a1a;
        }
        #quote-image {
            width: 460px;
            height: 460px;
            object-fit: cover;
            border-radius: 12px;
            margin: 25px auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <!-- Top banner -->
    <div style="background:#f8f8f8; color:#555; text-align:center; padding:14px 20px; font-size:1.05rem; border-bottom:1px solid #eee;">
        This website is still growing and evolving.<br>
        Feel free to explore the gallery or <a href="contact.html" style="color:#0066cc; text-decoration:underline;">get in touch</a> directly.
    </div>

    <!-- Dark mode toggle -->
    <div style="position:fixed; top:20px; right:40px; z-index:200; text-align:right;">
        <label class="switch">
            <input type="checkbox" id="dark-toggle">
            <span class="slider"></span>
        </label>
    </div>

    <div class="main-container">

        <!-- Left: Name + Thumbnails (original size) -->
        <div class="left-column">
            <h1 class="name">Martin Hanispak</h1>
            <div class="home-list">
                <a href="about.html" class="item">
                    <img src="images/Memory.webp" alt="">
                    <span>About</span>
                </a>
                <a href="gallery.html" class="item">
                    <img src="images/Lost Acrylic on Canvas.webp" alt="">
                    <span>Portfolio</span>
                </a>
                <a href="contact.html" class="item">
                    <img src="images/Love.webp" alt="">
                    <span>Contact</span>
                </a>
                <a href="thoughts.html" class="item">
                    <img src="images/The face of Flower.webp" alt="">
                    <span>Thoughts</span>
                </a>
                <a href="consulting.html" class="item">
                    <img src="images/Acrylic on Canvas Reused.webp" alt="">
                    <span>Consulting</span>
                </a>
            </div>
        </div>

        <!-- Right: Static grid of large images + quote box (like Jessica Chou example) -->
        <div class="right-column">
            <img src="images/Heart.webp" alt="">
            <img src="images/Lost Acrylic on Canvas.webp" alt="">
            <img src="images/The face of Flower.webp" alt="">
            <img src="images/Love.webp" alt="">
            <img src="images/Acrylic on Canvas Reused.webp" alt="">
            <img src="images/We suffer more in imagination than in reality.webp" alt="">

            <!-- Quote space -->
            <div class="quote-box">
                <p id="quote-text" style="font-style:italic; font-size:1.18rem; margin-bottom:25px; line-height:1.6;"></p>
                <img id="quote-image" src="" alt="">
            </div>
        </div>
    </div>

    <script>
    // Dark mode
    const toggle = document.getElementById('dark-toggle');
    toggle.addEventListener('change', () => {
        document.body.classList.toggle('dark', toggle.checked);
        localStorage.setItem('darkMode', toggle.checked);
    });
    if (localStorage.getItem('darkMode') === 'true') {
        document.body.classList.add('dark');
        toggle.checked = true;
    }

    // Quote rotator
    const quotes = [
        { text: "The artist must train not only his eye but also his soul." },
        { text: "Nature loves courage." },
        { text: "Stop thinking and start doing." },
        { text: "You are not a drop in the ocean. You are the entire ocean in a drop." }
    ];

    const allImages = [
        "images/Memory.webp", "images/Lost Acrylic on Canvas.webp", "images/Love.webp",
        "images/The face of Flower.webp", "images/Acrylic on Canvas Reused.webp", "images/Heart.webp",
        "images/We suffer more in imagination than in reality.webp", "images/You are on the right track now, do not turn..webp"
    ];

    let current = 0;
    function showQuote() {
        const q = quotes[current % quotes.length];
        const img = allImages[current % allImages.length];
        document.getElementById('quote-text').textContent = '"' + q.text + '"';
        document.getElementById('quote-image').src = img;
        current++;
    }
    showQuote();
    setInterval(showQuote, 8000);
    </script>
</body>
</html>
