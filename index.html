<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Martin Hanispak</title>
    <link rel="icon" href="images/Memory.webp">
    <link rel="stylesheet" href="style.css">
    <style>
        .main-container {
            display: flex;
            max-width: 1380px;
            margin: 40px auto 0;
            padding: 0 60px;
            gap: 90px;
        }
        .left-column {
            flex: 0 0 290px;
            width: 290px;
        }
        .name {
            font-family: 'Playfair Display', serif;
            font-size: 2.45rem;
            font-weight: 400;
            margin-bottom: 42px;
        }
        .home-list {
            display: flex;
            flex-direction: column;
            gap: 26px;
        }
        .item {
            display: flex;
            align-items: center;
            gap: 22px;
            text-decoration: none;
            color: inherit;
            transition: transform 0.3s ease;
        }
        .item:hover {
            transform: translateX(8px);
        }
        .item img {
            width: 82px;
            height: 82px;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.1);
        }
        .item span {
            font-size: 1.28rem;
        }

        .right-column {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
            gap: 30px;
        }
        .right-column img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
        }

        .quote-area {
            grid-column: 1 / -1;
            text-align: center;
            padding: 30px 0 40px;
        }
        .quote-text {
            font-style: italic;
            font-size: 1.25rem;
            line-height: 1.7;
            margin-bottom: 25px;
        }
        #quote-image {
            width: 420px;
            height: 420px;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <!-- Top banner - moved to very top, aligned with dark mode button -->
    <div style="background:#f8f8f8; color:#555; text-align:center; padding:14px 20px; font-size:1.05rem; border-bottom:1px solid #eee; position: relative;">
        This website is still growing and evolving.<br>
        Feel free to explore the gallery or <a href="contact.html" style="color:#0066cc; text-decoration:underline;">get in touch</a> directly.
        
        <!-- Dark mode toggle - aligned on the same line -->
        <div style="position:absolute; top:14px; right:60px;">
            <label class="switch">
                <input type="checkbox" id="dark-toggle">
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <div class="main-container">

        <!-- Left - Original thumbnails -->
