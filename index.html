<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Martin Hanispak</title>
    <link rel="icon" href="images/Memory.webp">
    <link rel="stylesheet" href="style.css">
    <style>
        .main-container {
            display: flex;
            max-width: 1280px;
            margin: 40px auto 0;
            padding: 0 40px;
            gap: 80px;
            align-items: flex-start;
        }
        .left-column {
            flex: 0 0 290px;   /* fixed width - thumbnails stay original size */
            width: 290px;
        }
        .name {
            font-family: 'Playfair Display', serif;
            font-size: 2.55rem;
            font-weight: 400;
            margin-bottom: 40px;
        }
        .home-list {
            display: flex;
            flex-direction: column;
            gap: 26px;
        }
        .item {
            display: flex;
            align-items: center;
            gap: 22px;
            text-decoration: none;
            color: inherit;
            transition: transform 0.3s ease;
        }
        .item:hover {
            transform: translateX(8px);
        }
        .item img {
            width: 82px;   /* exact original size */
            height: 82px;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.1);
        }
        .item span {
            font-size: 1.28rem;
        }

        .right-column {
            flex: 1;
            max-width: 820px;
        }
        .large-image {
            width: 100%;
            height: auto;
            max-height: 520px;
            object-fit: cover;
            border-radius: 16px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
        }
        .quote-box {
            margin-top: 30px;
            text-align: center;
            font-style: italic;
            font-size: 1.22rem;
            line-height: 1.65;
            color: #333;
        }
        body.dark .quote-box {
            color: #ddd;
        }
    </style>
</head>
<body>

    <!-- Top banner -->
    <div style="background:#f8f8f8; color:#555; text-align:center; padding:14px 20px; font-size:1.05rem; border-bottom:1px solid #eee;">
        This website is still growing and evolving.<br>
        Feel free to explore the gallery or <a href="contact.html" style="color:#0066cc; text-decoration:underline;">get in touch</a> directly.
    </div>

    <!-- Dark mode toggle -->
    <div style="position:fixed; top:20px; right:40px; z-index:200; text-align:right;">
        <label class="switch">
            <input type="checkbox" id="dark-toggle">
            <span class="slider"></span>
        </label>
    </div>

    <div class="main-container">

        <!-- Left side - Name + Original size thumbnails -->
        <div class="left-column">
            <h1 class="name">Martin Hanispak</h1>
            <div class="home-list">
                <a href="about.html" class="item">
                    <img src="images/Memory.webp" alt="">
                    <span>About</span>
                </a>
                <a href="gallery.html" class="item">
                    <img src="images/Lost Acrylic on Canvas.webp" alt="">
                    <span>Portfolio</span>
                </a>
                <a href="contact.html" class="item">
                    <img src="images/Love.webp" alt="">
                    <span>Contact</span>
                </a>
                <a href="thoughts.html" class="item">
                    <img src="images/The face of Flower.webp" alt="">
                    <span>Thoughts</span>
                </a>
                <a href="consulting.html" class="item">
                    <img src="images/Acrylic on Canvas Reused.webp" alt="">
                    <span>Consulting</span>
                </a>
            </div>
        </div>

        <!-- Right side - One large image + quote (exactly like your screenshot example) -->
        <div class="right-column">
            <img src="images/Heart.webp" class="large-image" alt="Heart painting">

            <div class="quote-box">
                <p id="quote-text" style="margin-bottom: 20px;">"You are not a drop in the ocean. You are the entire ocean in a drop."</p>
                <img id="quote-image" src="images/Love.webp" alt="" style="width: 380px; height: 380px; object-fit: cover; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);">
            </div>
        </div>
    </div>

    <script>
    // Dark mode
    const toggle = document.getElementById('dark-toggle');
    toggle.addEventListener('change', () => {
        document.body.classList.toggle('dark', toggle.checked);
        localStorage.setItem('darkMode', toggle.checked);
    });
    if (localStorage.getItem('darkMode') === 'true') {
        document.body.classList.add('dark');
        toggle.checked = true;
    }

    // Optional: Rotate quote + image slowly
    const quotes = [
        "You are not a drop in the ocean. You are the entire ocean in a drop.",
        "The artist must train not only his eye but also his soul.",
        "Nature loves courage.",
        "Stop thinking and start doing."
    ];

    const quoteImages = [
        "images/Love.webp",
        "images/The face of Flower.webp",
        "images/Heart.webp",
        "images/We suffer more in imagination than in reality.webp"
    ];

    let current = 0;
    function rotateQuote() {
        current = (current + 1) % quotes.length;
        document.getElementById('quote-text').textContent = '"' + quotes[current] + '"';
        document.getElementById('quote-image').src = quoteImages[current];
    }
    setInterval(rotateQuote, 9000);
    </script>
</body>
</html>
