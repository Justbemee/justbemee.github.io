        item.addEventListener('click', function(e) {
            e.preventDefault();
            const src = this.getAttribute('data-src');
            const shortTitle = this.getAttribute('data-title') || '';
            const fullTitle = this.getAttribute('data-full-title') || '';
            const medium = this.getAttribute('data-medium') || 'Acrylic on Canvas';
            const size = this.getAttribute('data-size') || '100×100 cm';
            const filename = src.split('/').pop().replace('.webp', '');
            const cleanName = filename.replace(/[-._]/g, ' ').replace(/\b\w/g, l => l.toUpperCase());

            document.getElementById('lightbox-img').src = src;
            document.getElementById('lightbox-name').textContent = shortTitle || cleanName;
            const availability = this.getAttribute('data-availability');
            document.getElementById('lightbox-full-title').textContent = fullTitle || cleanName;
            document.getElementById('lightbox-meta').textContent = `${medium}  ${size}${availability ? '  ' + availability : ''}`;
            document.getElementById('lightbox').style.display = 'flex';
        });
    });
    </script>
    <!-- GLOBAL DARK MODE SYSTEM -->
<script src="theme.js"></script>

</body>
