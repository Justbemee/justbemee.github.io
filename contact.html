<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Martin Hanispak — Contact</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <img src="images/Memory.webp" alt="Martin Hanispak">
            </a>
        </div>
    </nav>

    <div style="max-width:1000px; margin:100px auto; padding:0 40px;">
        <h1 style="font-family: 'Playfair Display', serif; font-weight:400; text-align:center; margin-bottom:20px;">Contact Me</h1>
        <p style="text-align:center; max-width:600px; margin:0 auto 60px; color:#666; font-size:1.1rem;">
            Want to buy a painting, collaborate, or just say hi? I’d love to hear from you.
        </p>

        <form action="https://formspree.io/f/YOUR_CODE_HERE" method="POST" style="max-width:600px; margin:0 auto;">
            <input type="text" name="name" placeholder="Your Name" required style="width:100%; padding:14px; margin-bottom:20px; border:1px solid #ddd; border-radius:8px; font-size:1.05rem;">
            <input type="email" name="email" placeholder="Your Email" required style="width:100%; padding:14px; margin-bottom:20px; border:1px solid #ddd; border-radius:8px; font-size:1.05rem;">
            <textarea name="message" placeholder="Your Message" rows="7" required style="width:100%; padding:14px; margin-bottom:30px; border:1px solid #ddd; border-radius:8px; font-size:1.05rem; resize:vertical;"></textarea>
            <button type="submit" style="width:100%; padding:14px; background:#111; color:white; border:none; border-radius:8px; font-size:1.1rem; cursor:pointer;">Send Message</button>
        </form>

        <div style="margin:50px 0; text-align:center; color:#888; font-size:1.05rem;">— OR —</div>

        <div style="text-align:center; font-size:1.1rem;">
            📧 <a href="mailto:discoverytwo@proton.me" style="color:#0066cc;">discoverytwo@proton.me</a><br><br>
            📱 <a href="tel:+421944150131" style="color:#0066cc;">+421 944 150 131</a>
        </div>
    </div>

    <footer style="text-align:center; padding:80px 20px 40px; color:#666;">
        <a href="index.html"><img src="images/Memory.webp" style="height:40px; border-radius:8px;"></a>
        <p>Home</p>
        <p>© 2026 Martin Hanispak</p>
    </footer>

    <script>
    // Simple dark mode persistence (if you have it)
    if (localStorage.getItem('darkMode') === 'true') {
        document.body.classList.add('dark');
    }
    </script>
</body>
</html>
