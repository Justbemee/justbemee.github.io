    <link rel="stylesheet" href="style.css">
</head>

<body class="contact-page">

<nav class="page-nav" aria-label="Main navigation">
    <div class="nav-container page-nav-container">
        <div class="page-nav-links">
            <a class="page-nav-link" href="index.html" aria-label="Home">
                <img src="images/3yo.jpg" alt="">
                <span class="page-nav-label" aria-hidden="true">Home</span>
            </a>
            <a class="page-nav-link" href="about.html" aria-label="About">
                <img src="images/Memory.webp" alt="">
                <span class="page-nav-label" aria-hidden="true">About</span>
            </a>
            <a class="page-nav-link" href="gallery.html" aria-label="Portfolio">
                <img src="images/Lost Acrylic on Canvas.webp" alt="">
                <span class="page-nav-label" aria-hidden="true">Portfolio</span>
            </a>
            <a class="page-nav-link" href="contact.html" aria-label="Contact" aria-current="page">
                <img src="images/Love.webp" alt="">
                <span class="page-nav-label" aria-hidden="true">Contact</span>
            </a>
            <a class="page-nav-link" href="consulting.html" aria-label="Shop">
                <img src="images/Sliding square.jpg" alt="">
                <span class="page-nav-label" aria-hidden="true">Shop</span>
            </a>
        </div>
    </div>
</nav>

<div style="max-width:1000px; margin:80px auto 100px; padding:0 40px;">

    <h1 class="page-title">
        Contact
    </h1>

    <p style="text-align:center; max-width:620px; margin:0 auto 70px; color:var(--muted); font-size:1.1rem;">
        Interested in a painting, collaboration, or just want to say hello? I’d love to hear from you.
    </p>

    <form action="https://formspree.io/f/mpqoowwy" method="POST" style="max-width:620px; margin:0 auto 80px;">

         <input class="contact-field" type="text" name="name" placeholder="Your Name" required>

         <input class="contact-field" type="email" name="email" placeholder="Your Email" required>

         <textarea class="contact-field contact-message" name="message" placeholder="Your Message" rows="7" required></textarea>

         <button class="contact-submit" type="submit">
            Send Message
        </button>

    </form>

    <div class="contact-divider" style="margin:50px 0; text-align:center; font-size:1.1rem;">
        — OR —
    </div>

    <div class="contact-links" style="text-align:center; font-size:1.15rem; line-height:1.8;">
        📧 <a href="mailto:discoverytwo@proton.me">discoverytwo@proton.me</a>
    </div>

</div>

<footer style="text-align:center; padding:80px 20px 50px; color:var(--muted);">
    <a href="index.html">
        <img src="images/Memory.webp" style="height:40px; border-radius:8px;">
    </a>
    <p style="margin:12px 0 8px;">Home</p>
    <p>© 2026 Martin Hanispak</p>
</footer>

<!-- GLOBAL DARK MODE SYSTEM -->

</html>
